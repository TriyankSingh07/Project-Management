<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{index::Layout(~{::div})}">

<head>
	<meta charset="UTF-8">
	<title th:text="${client.id != null ? 'Update Client' : 'Create Client'}">Create Client</title>
</head>

<body>

	<div>

		<div class="pagetitle">
			<h1 th:text="${client.id != null ? 'Update Client' : 'Create Client'}">Create Client</h1>
		</div>

		<section class="section">

			<div class="card">

				<div class="card-body">

					<h5 class="card-title" th:text="${client.id != null ? 'Update Client' : 'Create Client'}">Create Client</h5>

					<form th:action="@{/master-client/save}" th:object="${client}" method="post">

						<input type="hidden" th:field="*{id}" th:if="${client.id != null}">

						<div class="row">

							<!-- Client Name -->
							<div class="col-md-4 mb-3">

								<label class="form-label fw-bold">
									NAME
								</label>

								<input type="text" th:field="*{name}"
									th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" class="form-control"
									placeholder="Enter">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
								</div>

							</div>

							<!-- Email -->
							<div class="col-md-4 mb-3">

								<label class="form-label fw-bold">
									EMAIL ID
								</label>

								<input type="email" th:field="*{email}"
									th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" class="form-control"
									placeholder="Enter">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
									th:errors="*{email}"></div>

							</div>

							<!-- Phone -->
							<div class="col-md-4 mb-3">

								<label class="form-label fw-bold">
									PHONE NUMBER
								</label>

								<input type="text" th:field="*{phone}"
									th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" class="form-control"
									placeholder="Enter">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
									th:errors="*{phone}"></div>

							</div>

						</div>

						<div class="row">

							<!-- Contact Person -->
							<div class="col-md-4 mb-3">

								<label class="form-label fw-bold">
									CONTACT PERSON
								</label>

								<input type="text" th:field="*{contact}"
									th:classappend="${#fields.hasErrors('contact')} ? 'is-invalid'" class="form-control"
									placeholder="Enter">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('contact')}"
									th:errors="*{contact}"></div>

							</div>

							<!-- Status (update only) -->
							<div class="col-md-4 mb-3" th:if="${client.id != null}">

								<label class="form-label fw-bold">
									STATUS
								</label>

								<select th:field="*{status}"
									th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'" class="form-select">

									<option value="">Select</option>
									<option value="1">Active</option>
									<option value="0">Inactive</option>

								</select>
								<div class="invalid-feedback" th:if="${#fields.hasErrors('status')}"
									th:errors="*{status}"></div>

							</div>

						</div>

						<div class="mt-3">
							
							<a th:href="@{/master-client/list}" class="btn btn-secondary">
								Cancel
							</a>

							<button type="submit" class="btn btn-primary"
								th:text="${client.id != null ? 'Update' : 'Create'}">

								Create

							</button>

						</div>

					</form>

				</div>

			</div>

		</section>

	</div>

</body>

</html>
