<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{index::Layout(~{::div})}">

<head>
	<meta charset="UTF-8">
	<title>Transaction Type</title>
</head>

<body>

	<div>

		<div class="pagetitle d-flex justify-content-between align-items-center">
			<h1>TRANSACTION TYPE</h1>
			<nav>
				<ol class="breadcrumb mb-0">
					<li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
					<li class="breadcrumb-item">Master</li>
					<li class="breadcrumb-item active">Transaction Type</li>
				</ol>
			</nav>
		</div>

		<section class="section">

			<div class="card">

				<div class="card-body">

					<div class="col-lg-12">
						<div class="row mt-3">

							<div class="col-lg-8">

								<form th:action="@{/master-transaction/list}" th:object="${search}" method="get"
									class="row g-2 align-items-end mb-3">

									<div class="col-md-4">
										<input type="text" name="transactionName" class="form-control"
											placeholder="Search By Name" th:value="*{transactionName}">
									</div>

									<div class="col-md-4">
										<select name="status" class="form-select">
											<option value="">Select Status</option>
											<option value="1" th:selected="*{status != null and status == 1}">Active
											</option>
											<option value="0" th:selected="*{status != null and status == 0}">Inactive
											</option>
										</select>
									</div>

									<div class="col-md-auto">
										<button type="submit" class="btn btn-search-hollow">
											<i class="bi bi-search"></i>
											Search
										</button>
									</div>

								</form>
							</div>

							<div class="col-lg-4 text-end">
								<a th:href="@{/master-transaction/add}" class="btn btn-create-yellow">
									+ Create
								</a>
							</div>

							<div class="table-responsive">

								<table class="table master-transaction-table">

									<colgroup>
										<col style="width: 10%;">
										<col style="width: 20%;">
										<col style="width: 10%;">
										<col style="width: 10%;">
									</colgroup>

									<thead>
										<tr>
											<th class="master-transaction-th">#</th>
											<th class="master-transaction-th">Name</th>
											<th class="master-transaction-th text-end">Status</th>
											<th class="master-transaction-th text-end">Action</th>
										</tr>
									</thead>

									<tbody>

										<tr th:if="${#lists.isEmpty(list)}">
											<td colspan="4" class="text-center">
												No Data Found
											</td>
										</tr>

										<tr th:each="transaction, stat : ${list}">

											<td th:text="${stat.count}"></td>

											<td th:text="${transaction.name}"></td>

											<td class="text-end">

												<span th:if="${transaction.status == 1}" class="badge bg-success">

													Active

												</span>

												<span th:if="${transaction.status == 0}" class="badge bg-danger">

													Inactive

												</span>

											</td>

											<td class="text-end">
												<a th:href="@{'/master-transaction/edit/' + ${transaction.id}}"
													class="master-transaction-edit" title="Edit">
													<i class="fa-solid fa-pen-to-square"></i>
												</a>
											</td>

										</tr>

									</tbody>

								</table>

							</div>

							<div class="mt-2 text-muted small" th:if="${!#lists.isEmpty(list)}"
								th:text="|Showing 1-${#lists.size(list)} of ${#lists.size(list)} items.|">
							</div>
							<div class="mt-2 text-muted small" th:if="${#lists.isEmpty(list)}">
								Showing 0 of 0 items.
							</div>

						</div>

					</div>

				</div>

			</div>

		</section>

	</div>

</body>

</html>
