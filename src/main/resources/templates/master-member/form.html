<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{index::Layout(~{::div})}">

<head>
	<meta charset="UTF-8">
	<title th:text="${member.id != null ? 'Update Member' : 'Create Member'}">Create Member</title>
</head>

<body>

	<div>

		<div class="pagetitle">
			<h1 th:text="${member.id != null ? 'Update Member' : 'Create Member'}">Create Member</h1>
		</div>

		<section class="section">

			<div class="card">

				<div class="card-body">

					<h5 class="card-title" th:text="${member.id != null ? 'Update Member' : 'Create Member'}">Create Member</h5>

					<form th:action="@{/master-member/save}" th:object="${member}" method="post">

						<input type="hidden" th:field="*{id}" th:if="${member.id != null}">

						<div class="row">

							<div class="col-md-4 mb-3">

								<label class="form-label fw-bold">
									NAME
								</label>

								<input type="text" th:field="*{name}"
									th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" class="form-control"
									placeholder="Enter">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
								</div>

							</div>

							<div class="col-md-4 mb-3">

								<label class="form-label fw-bold">
									DESIGNATION
								</label>

								<input type="text" th:field="*{designation}"
									th:classappend="${#fields.hasErrors('designation')} ? 'is-invalid'" class="form-control"
									placeholder="Enter">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('designation')}"
									th:errors="*{designation}"></div>

							</div>

							<div class="col-md-4 mb-3">

								<label class="form-label fw-bold">
									TEAM
								</label>

								<input type="text" th:field="*{team}"
									th:classappend="${#fields.hasErrors('team')} ? 'is-invalid'" class="form-control"
									placeholder="Enter">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('team')}"
									th:errors="*{team}"></div>

							</div>

						</div>

						<div class="row">

							<div class="col-md-4 mb-3" th:if="${member.id != null}">

								<label class="form-label fw-bold">
									STATUS
								</label>

								<select th:field="*{status}"
									th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'" class="form-select">

									<option value="">Select</option>
									<option value="1">Active</option>
									<option value="0">Inactive</option>

								</select>
								<div class="invalid-feedback" th:if="${#fields.hasErrors('status')}"
									th:errors="*{status}"></div>

							</div>

						</div>

						<div class="mt-3">

							<a th:href="@{/master-member/list}" class="btn btn-secondary">
								Cancel
							</a>

							<button type="submit" class="btn btn-primary"
								th:text="${member.id != null ? 'Update' : 'Create'}">

								Create

							</button>

						</div>

					</form>

				</div>

			</div>

		</section>

	</div>

</body>

</html>
